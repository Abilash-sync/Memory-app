<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Game</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { margin: 0 0 0.5rem; }
    .info {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1rem;
      font-size: 1rem;
      color: #374151;
    }
    .info b { color: #4f46e5; }
    .board {
      display: grid;
      grid-template-columns: repeat(4, 80px);
      grid-gap: 0.6rem;
    }
    .card {
      width: 80px;
      height: 80px;
      background: #4f46e5;
      color: #fff;
      border-radius: 10px;
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: background 0.3s, transform 0.2s;
    }
    .card:hover { background: #4338ca; }
    .card.flipped {
      background: #fff;
      color: #111;
      border: 2px solid #4f46e5;
    }
    .card.matched {
      background: #10b981;
      color: #fff;
      cursor: default;
    }
    button {
      margin-top: 1.2rem;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    .win {
      margin-top: 1rem;
      font-size: 1.2rem;
      color: #10b981;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>🧠 Memory App Not</h1>
  <div class="info">
    <div>Moves: <b id="moves">0</b></div>
    <div>Pairs: <b id="pairs">0</b> / 8</div>
  </div>
  <div class="board" id="board"></div>
  <button id="restart">New Game</button>
  <div class="win" id="win"></div>

  <script>
    const EMOJIS = ['🍎', '🍌', '🍇', '🍓', '🍒', '🍑', '🥝', '🍍'];
    const board = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const pairsEl = document.getElementById('pairs');
    const winEl = document.getElementById('win');
    const restartBtn = document.getElementById('restart');

    let cards = [];
    let flipped = [];
    let moves = 0;
    let pairs = 0;
    let locked = false;

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function newGame() {
      cards = shuffle([...EMOJIS, ...EMOJIS]).map((emoji, i) => ({
        id: i,
        emoji,
        flipped: false,
        matched: false,
      }));
      flipped = [];
      moves = 0;
      pairs = 0;
      locked = false;
      winEl.textContent = '';
      update();
      render();
    }

    function update() {
      movesEl.textContent = moves;
      pairsEl.textContent = pairs;
    }

    function render() {
      board.innerHTML = '';
      cards.forEach((card) => {
        const div = document.createElement('div');
        div.className = 'card';
        if (card.flipped || card.matched) div.classList.add('flipped');
        if (card.matched) div.classList.add('matched');
        div.textContent = (card.flipped || card.matched) ? card.emoji : '?';
        div.addEventListener('click', () => flip(card));
        board.appendChild(div);
      });
    }

    function flip(card) {
      if (locked) return;
      if (card.flipped || card.matched) return;
      if (flipped.length === 2) return;

      card.flipped = true;
      flipped.push(card);
      render();

      if (flipped.length === 2) {
        moves++;
        update();
        const [a, b] = flipped;
        if (a.emoji === b.emoji) {
          a.matched = true;
          b.matched = true;
          pairs++;
          flipped = [];
          update();
          render();
          if (pairs === EMOJIS.length) {
            winEl.textContent = `🎉 You won in ${moves} moves!`;
          }
        } else {
          locked = true;
          setTimeout(() => {
            a.flipped = false;
            b.flipped = false;
            flipped = [];
            locked = false;
            render();
          }, 700);
        }
      }
    }

    restartBtn.addEventListener('click', newGame);
    newGame();
  </script>
</body>
</html>
